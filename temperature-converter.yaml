apiVersion: apps/v1
kind: Deployment
metadata:
  name: temperature-converter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: temperature-converter
  template:
    metadata:
      labels:
        app: temperature-converter
    spec:
      containers:
        - name: temperature-converter
          image: sourini/temperature-converter:latest
          imagePullPolicy: Always
          env:
            - name: DISPLAY
              value: "host.minikube.internal:0.0"